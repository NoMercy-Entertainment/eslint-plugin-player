name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted for now: the self-hosted runners failed in the sibling KMP
    # repos (#48). Back to self-hosted once those are fixed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before setup-node: its yarn cache step runs the global yarn 1 otherwise,
      # which refuses a repo that pins yarn 4 in packageManager.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit tests
        run: yarn test
